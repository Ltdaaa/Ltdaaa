<svg width='760' height='360' viewBox='0 0 760 360' fill='none' xmlns='http://www.w3.org/2000/svg' role='img' aria-labelledby='title desc'>
<title id='title'>Ltdaaa contribution maze</title>
<desc id='desc'>Anime-inspired contribution maze card generated from public GitHub contribution data.</desc>
<defs>
<linearGradient id='cardBg' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#fff8fc' /><stop offset='100%' stop-color='#eef6ff' /></linearGradient>
<linearGradient id='glowPath' x1='0' y1='0' x2='1' y2='0'><stop offset='0%' stop-color='#f38bb3' /><stop offset='50%' stop-color='#f8b6d2' /><stop offset='100%' stop-color='#ffd86b' /></linearGradient>
<filter id='softGlow' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='3' result='blur' /><feMerge><feMergeNode in='blur' /><feMergeNode in='SourceGraphic' /></feMerge></filter>
</defs>
<rect x='8' y='8' width='744' height='344' rx='28' fill='url(#cardBg)' stroke='#f2bfd3' stroke-width='2' />
<circle cx='56' cy='52' r='20' fill='#ffd7e8' />
<circle cx='112' cy='52' r='12' fill='#ffd86b' opacity='0.8' />
<text x='88' y='46' font-size='24' font-family='Verdana, sans-serif' fill='#6b3956'>Contribution Maze</text>
<text x='88' y='74' font-size='13' font-family='Verdana, sans-serif' fill='#8d6080'>@Ltdaaa | 0 contributions | 0 active days</text>
<text x='52' y='98' font-size='12' font-family='Verdana, sans-serif' fill='#9b7590'>Daily auto-refresh via GitHub Actions | Updated 2026-07-12 03:49 UTC</text>
<path d='M 57.0 117.0' stroke='url(#glowPath)' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' opacity='0.95' fill='none' filter='url(#softGlow)' stroke-dasharray='600' stroke-dashoffset='600'><animate attributeName='stroke-dashoffset' from='600' to='0' dur='6s' repeatCount='indefinite' /></path>
