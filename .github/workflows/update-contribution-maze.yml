name: Update Contribution Maze

on:
  workflow_dispatch:
  schedule:
    - cron: '12 0 * * *'
  push:
    paths:
      - '.github/workflows/update-contribution-maze.yml'
      - 'scripts/generate_contribution_maze.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROFILE_USERNAME: Ltdaaa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate contribution maze card
        run: python scripts/generate_contribution_maze.py --username "$PROFILE_USERNAME" --output assets/contribution-maze.svg

      - name: Commit refreshed SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contribution-maze.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution maze"
          git push
